name: Staging Image

# Builds the staging builder-and-server image (deploy/staging-image/) that the CMS's staging stack on as2 runs, and pushes it to GHCR as `edwardjensen-net-astro-staging:main` (plus `:<sha7>`) on every merge to main that changes the site. A pull request that changes the image's inputs builds it without pushing. as2's Doco-CD follows `:main`, so staging always serves the latest main.
#
# This is the only staging build: the GitHub-driven staging deploy (deploy-staging.yml, over Tailscale SSH) was retired on 2026-10-30.

on:
  push:
    branches: [main]
    paths-ignore:
      - 'contexts/**'
      - 'docs/**'
      - '*.md'
      - 'cloudflare-workers/**'
    # A new production tag rebuilds the image from main with that tag as its release tree. Tag pushes ignore the path filters above.
    tags: ['v*']
  pull_request:
    branches: [main]
    paths:
      - 'deploy/staging-image/**'
      - 'package.json'
      - 'package-lock.json'
      - '.node-version'
      - '.github/workflows/staging-image.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: staging-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  image:
    name: Build staging image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          # Always main, even for a tag push: the image follows main, and the tag becomes its release tree.
          ref: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/') && 'main' || github.sha }}
          fetch-depth: 0

      - name: Find the newest production tag
        id: release
        run: |
          tag=$(git tag --list 'v*' --sort=-v:refname | head -n 1)
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "sha=$([ -n "$tag" ] && git rev-list -n 1 "$tag")" >> "$GITHUB_OUTPUT"

      - name: Read the main commit
        id: main
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Read the Node version
        id: node
        run: echo "version=$(tr -d '[:space:]' < .node-version)" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build${{ github.event_name != 'pull_request' && ' and push' || '' }}
        uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/staging-image/Dockerfile
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ghcr.io/edwardjensen/edwardjensen-net-astro-staging:main
            ghcr.io/edwardjensen/edwardjensen-net-astro-staging:${{ steps.main.outputs.sha }}
          build-args: |
            NODE_VERSION=${{ steps.node.outputs.version }}
            GIT_SHA=${{ steps.main.outputs.sha }}
            RELEASE_TAG=${{ steps.release.outputs.tag }}
            RELEASE_SHA=${{ steps.release.outputs.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
