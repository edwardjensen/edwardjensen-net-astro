name: Republish Production Site

# Rebuilds and redeploys the production site with the latest CMS content.
# Fetches content from the relay worker, builds from the latest production tag,
# and deploys.
#
# Triggers on CMS publish events (content or photography) or manual dispatch.

permissions:
  contents: read

on:
  workflow_dispatch:
  repository_dispatch:
    types: ['prod_cms_publish', 'prod_cms_photo_publish']

jobs:
  build-and-deploy:
    name: Build and Deploy Site
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Wait for relay KV propagation
        # On repository_dispatch, the CMS sends client_payload with the published doc's
        # updatedAt and collection. Cloudflare KV is eventually consistent (up to ~60s
        # globally), so we poll the relay's meta endpoint until it reflects the new
        # content before we start the build. This prevents deploying a site built from
        # stale relay data.
        #
        # Skipped on workflow_dispatch (manual runs) since there's no client_payload.
        if: github.event_name == 'repository_dispatch'
        env:
          CONTENT_RELAY_URL: ${{ secrets.CONTENT_RELAY_URL }}
          CONTENT_RELAY_READ_KEY: ${{ secrets.CONTENT_RELAY_READ_KEYS }}
        run: |
          COLLECTION="${{ github.event.client_payload.collection }}"
          UPDATED_AT="${{ github.event.client_payload.updatedAt }}"

          if [[ -z "$COLLECTION" || -z "$UPDATED_AT" ]]; then
            echo "No collection/updatedAt in client_payload — skipping relay wait."
            exit 0
          fi

          TARGET_TS=$(date -d "$UPDATED_AT" +%s)
          echo "Waiting for relay '${COLLECTION}' meta.updatedAt >= ${UPDATED_AT} (target: ${TARGET_TS})..."

          MAX_WAIT=120
          INTERVAL=5
          ELAPSED=0

          while [[ $ELAPSED -lt $MAX_WAIT ]]; do
            RELAY_UPDATED_AT=$(curl -sf \
              -H "X-Read-Key: ${CONTENT_RELAY_READ_KEY}" \
              "${CONTENT_RELAY_URL}/v2/meta/${COLLECTION}" \
              | jq -r '.updatedAt // empty' 2>/dev/null || true)

            if [[ -n "$RELAY_UPDATED_AT" ]]; then
              RELAY_TS=$(date -d "$RELAY_UPDATED_AT" +%s)
              if [[ $RELAY_TS -ge $TARGET_TS ]]; then
                echo "Relay is ready (updatedAt=${RELAY_UPDATED_AT}). Proceeding with build."
                exit 0
              fi
              echo "[${ELAPSED}s] Relay not ready yet (relay=${RELAY_UPDATED_AT} < target=${UPDATED_AT}). Retrying in ${INTERVAL}s..."
            else
              echo "[${ELAPSED}s] No relay meta yet. Retrying in ${INTERVAL}s..."
            fi

            sleep $INTERVAL
            ELAPSED=$((ELAPSED + INTERVAL))
          done

          echo "::warning::Relay wait timed out after ${MAX_WAIT}s — proceeding with build anyway."

      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: main

      - name: Checkout latest production tag
        run: |
          LATEST_TAG=$(git tag -l "v*" --sort=-v:refname | head -n 1)

          if [[ -z "${LATEST_TAG}" ]]; then
            echo "::error::No production tag found. Create a tag before republishing."
            exit 1
          fi

          echo "Checking out: ${LATEST_TAG}"
          git checkout "${LATEST_TAG}"
          echo "LATEST_TAG=${LATEST_TAG}" >> $GITHUB_ENV

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ vars.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate build info
        run: |
          BUILD_DATE=$(TZ=${{ vars.TIMEZONE }} date +'%-d %B %Y')
          cat > src/data/buildinfo.ts << HEREDOC
          // Auto-generated by CI/CD. Do not edit manually.
          export const buildInfo = {
            commit: "${{ github.sha }}",
            buildId: "${{ github.run_id }}",
            buildDate: "${BUILD_DATE}",
            version: "${LATEST_TAG}",
            buildName: "${{ github.workflow }}",
          } as const;
          HEREDOC

      - name: Build site
        env:
          CONTENT_RELAY_URL: ${{ secrets.CONTENT_RELAY_URL }}
          CONTENT_RELAY_READ_KEY: ${{ secrets.CONTENT_RELAY_READ_KEYS }}
        run: npm run build

      - name: Install Wrangler
        run: npm install -g wrangler@4

      - name: Deploy to Cloudflare Workers
        # Uses the adapter-generated dist/server/wrangler.json which has the correct
        # entry point (dist/server/entry.mjs) and asset paths (dist/client/).
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: wrangler deploy --config dist/server/wrangler.json --name ${{ secrets.CF_DEPLOYMENT_WORKER }}
